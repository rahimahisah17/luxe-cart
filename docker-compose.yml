services:
  database:
    image: postgres:16-alpine
    container_name: luxecart-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: luxecart
      POSTGRES_USER: luxecart_user
      POSTGRES_PASSWORD: luxecart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: